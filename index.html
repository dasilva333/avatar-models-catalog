<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Models - Definitive Catalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0c10;
      --bg-card: rgba(20, 24, 33, 0.7);
      --bg-card-hover: rgba(30, 36, 50, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-live2d: #38bdf8;
      --accent-vrm: #a855f7;
      --accent-mmd: #f43f5e;
      --accent-vrma: #10b981;
      --accent-spine: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(15, 18, 26, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 1.25rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge-count {
      background: rgba(168, 85, 247, 0.15);
      color: var(--accent-vrm);
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
    }

    .combo-search-container {
      flex: 1;
      min-width: 320px;
      position: relative;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.35rem 0.6rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }
    .combo-search-container:focus-within {
      border-color: var(--accent-vrm);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.25);
    }

    .tag-chip-active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(168, 85, 247, 0.25));
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #fff;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .tag-chip-active .remove-btn {
      cursor: pointer;
      font-weight: 700;
      color: var(--text-muted);
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      transition: all 0.15s;
    }
    .tag-chip-active .remove-btn:hover {
      color: #f43f5e;
      background: rgba(255, 255, 255, 0.15);
    }

    .combo-input {
      flex: 1;
      min-width: 140px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      padding: 0.3rem 0.4rem;
    }

    .match-mode-toggle {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.2rem;
      gap: 0.2rem;
    }
    .match-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      font-size: 0.775rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .match-btn.active {
      background: rgba(168, 85, 247, 0.3);
      color: #fff;
      border: 1px solid rgba(168, 85, 247, 0.5);
    }

    .autocomplete-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: rgba(15, 18, 26, 0.96);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 10px;
      max-height: 280px;
      overflow-y: auto;
      z-index: 200;
      display: none;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.8);
    }
    .autocomplete-dropdown.open { display: block; }
    .autocomplete-item {
      padding: 0.65rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.85rem;
      transition: background 0.15s;
    }
    .autocomplete-item:hover, .autocomplete-item.selected {
      background: rgba(168, 85, 247, 0.2);
    }
    .autocomplete-item .tag-count {
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent-live2d);
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      font-size: 0.725rem;
      font-weight: 600;
    }

    .filter-pills {
      display: flex;
      gap: 0.4rem;
    }
    .pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.825rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .pill.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .smb-config {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
    }
    .smb-config label { color: var(--text-muted); }
    .smb-config input {
      background: transparent;
      border: none;
      color: var(--accent-live2d);
      font-family: monospace;
      font-size: 0.825rem;
      outline: none;
      width: 180px;
    }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.6);
      background: var(--bg-card-hover);
    }

    .thumb-wrapper {
      width: 100%;
      height: 240px;
      background: #0f1219;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .card:hover .thumb-wrapper img {
      transform: scale(1.04);
    }
    .thumb-placeholder {
      color: rgba(255, 255, 255, 0.15);
      font-size: 2.5rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .type-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      font-size: 0.675rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
    .type-live2d { background: var(--accent-live2d); color: #000; }
    .type-vrm { background: var(--accent-vrm); color: #fff; }
    .type-mmd { background: var(--accent-mmd); color: #fff; }
    .type-vrma { background: var(--accent-vrma); color: #000; }
    .type-spine { background: var(--accent-spine); color: #000; }

    .card-body {
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }
    .card-title {
      font-size: 0.925rem;
      font-weight: 600;
      line-height: 1.3;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      height: 2.4em;
    }

    .card-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.45rem;
      border-radius: 6px;
      font-size: 0.775rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      text-align: center;
      margin-top: auto;
    }
    .btn-copy:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.4);
      color: #fff;
    }
    .btn-copy.copied {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.4);
      color: #10b981;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #141821;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 90%;
      max-width: 850px;
      max-height: 85vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      transform: scale(0.95);
      transition: transform 0.25s;
    }
    .modal-overlay.open .modal-content {
      transform: scale(1);
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: #141821;
      z-index: 10;
    }
    .modal-header h2 { font-size: 1.15rem; font-weight: 700; }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }
    .modal-close:hover { color: #fff; }

    .modal-body {
      padding: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .modal-preview {
      flex: 1;
      min-width: 280px;
      max-width: 360px;
      height: 380px;
      background: #0f1219;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-color);
    }
    .modal-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-details {
      flex: 1;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .detail-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .detail-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .detail-value {
      font-size: 0.9rem;
      color: #fff;
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .tag-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tag-chip:hover {
      background: rgba(168, 85, 247, 0.2);
      color: #fff;
      border-color: rgba(168, 85, 247, 0.4);
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: rgba(16, 185, 129, 0.9);
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 2000;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="brand">
        <h1>Avatar Models Catalog</h1>
        <span class="badge-count" id="totalCount">Loading...</span>
      </div>

      <div class="smb-config">
        <label for="smbPath">SMB Root Path:</label>
        <input type="text" id="smbPath" value="\\DESKTOP-V98N0H7\Avatar Models">
      </div>
    </div>

    <div class="controls-row">
      <div class="combo-search-container" id="comboSearchContainer">
        <div id="activeTagChips" style="display: flex; flex-wrap: wrap; gap: 0.35rem;"></div>
        <input type="text" class="combo-input" id="searchInput" placeholder="Search title, character, or type tags..." autocomplete="off">
        
        <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
      </div>

      <div class="match-mode-toggle">
        <button class="match-btn active" id="matchAllBtn" title="Match ALL active tags and text (AND mode)">MATCH ALL (AND)</button>
        <button class="match-btn" id="matchAnyBtn" title="Match ANY active tag or text (OR mode)">MATCH ANY (OR)</button>
      </div>

      <div class="filter-pills" id="filterPills">
        <div class="pill active" data-filter="all">All Formats</div>
        <div class="pill" data-filter="live2d">Live2D</div>
        <div class="pill" data-filter="vrm">VRM</div>
        <div class="pill" data-filter="spine">Spine</div>
        <div class="pill" data-filter="mmd">MMD</div>
        <div class="pill" data-filter="vrma">VRMA</div>
      </div>
    </div>
  </header>

  <main>
    <div class="grid" id="catalogGrid"></div>
  </main>

  <div class="modal-overlay" id="metaModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Model Details</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-preview" id="modalPreview"></div>
        <div class="modal-details" id="modalDetails"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    let catalogData = [];
    let activeTags = [];
    let tagCountsMap = {};
    let allUniqueTagsSorted = [];
    let currentFilter = 'all';
    let matchMode = 'and';

    const grid = document.getElementById('catalogGrid');
    const searchInput = document.getElementById('searchInput');
    const comboSearchContainer = document.getElementById('comboSearchContainer');
    const activeTagChips = document.getElementById('activeTagChips');
    const autocompleteDropdown = document.getElementById('autocompleteDropdown');
    const matchAllBtn = document.getElementById('matchAllBtn');
    const matchAnyBtn = document.getElementById('matchAnyBtn');
    const filterPills = document.getElementById('filterPills');
    const smbPathInput = document.getElementById('smbPath');
    const totalCountEl = document.getElementById('totalCount');
    const toast = document.getElementById('toast');
    const metaModal = document.getElementById('metaModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalPreview = document.getElementById('modalPreview');
    const modalDetails = document.getElementById('modalDetails');

    matchAllBtn.addEventListener('click', () => {
      matchMode = 'and';
      matchAllBtn.classList.add('active');
      matchAnyBtn.classList.remove('active');
      render();
    });

    matchAnyBtn.addEventListener('click', () => {
      matchMode = 'or';
      matchAnyBtn.classList.add('active');
      matchAllBtn.classList.remove('active');
      render();
    });

    const savedSmb = localStorage.getItem('avatar_smb_path');
    if (savedSmb) smbPathInput.value = savedSmb;

    smbPathInput.addEventListener('input', (e) => {
      localStorage.setItem('avatar_smb_path', e.target.value);
    });

    async function loadCatalog() {
      try {
        let fetchUrl = `catalog.json?v=${Date.now()}`;
        if (window.location.pathname.includes('/index/')) {
          fetchUrl = `catalog.json?v=${Date.now()}`;
        } else if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          fetchUrl = `index/catalog.json?v=${Date.now()}`;
        }
        const res = await fetch(fetchUrl);
        const data = await res.json();
        catalogData = data.models || [];
        buildTagIndex();
        render();
      } catch (err) {
        console.error('Error loading catalog.json:', err);
        grid.innerHTML = `<div style="color: #f43f5e; padding: 2rem;">Error loading catalog.json</div>`;
      }
    }

    function buildTagIndex() {
      tagCountsMap = {};
      for (const item of catalogData) {
        const tags = item.tags || [];
        for (const rawTag of tags) {
          const t = rawTag.toLowerCase();
          tagCountsMap[t] = (tagCountsMap[t] || 0) + 1;
        }
      }
      allUniqueTagsSorted = Object.keys(tagCountsMap).sort((a, b) => tagCountsMap[b] - tagCountsMap[a]);
    }

    function getThumbUrl(item) {
      if (!item) return null;
      let raw = item.relative_thumbnail_path;
      if (!raw && item.thumbnail) {
        const fmt = (item.model_type || item.format || 'live2d').toLowerCase();
        raw = `triage/${fmt}/${item.thumbnail}`;
      }
      if (!raw && item.id) {
        raw = `thumbnails/${item.id}.jpg`;
      }
      if (!raw) return null;
      raw = raw.replace(/^[/\\]+/, '');

      // Ensure bare filenames like "1110496504.jpg" are prefixed with thumbnails/
      if (!raw.includes('/') && !raw.includes('\\')) {
        raw = `thumbnails/${raw}`;
      }

      if (raw.startsWith('http://') || raw.startsWith('https://')) return raw;

      // When running on local development server
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        const prefix = window.location.pathname.includes('/index/') ? '../' : '';
        return `${prefix}${raw}`;
      }

      // Live GitHub Pages & Remote: Stream directly from GitHub Raw CDN
      return `https://raw.githubusercontent.com/dasilva333/avatar-models-catalog/main/${raw}`;
    }

    function handleThumbError(img, id, thumbName, modelType) {
      if (!img.dataset.triedFallback) {
        img.dataset.triedFallback = '1';
        const file = thumbName || (id + '.jpg');
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const prefix = window.location.pathname.includes('/index/') ? '../' : '';
        const fallbackUrl = isLocal
          ? `${prefix}thumbnails/${file}`
          : `https://raw.githubusercontent.com/dasilva333/avatar-models-catalog/main/thumbnails/${file}`;
        img.src = fallbackUrl;
      } else {
        img.parentElement.innerHTML = `<div class="thumb-placeholder">${(modelType || 'MODEL').toUpperCase()}</div>`;
      }
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function copyPath(relPath, btn, event) {
      if (event) event.stopPropagation();
      const basePath = smbPathInput.value.replace(/[/\\]+$/, '');
      const fullPath = `${basePath}\\${relPath.replace(/\//g, '\\')}`;
      
      navigator.clipboard.writeText(fullPath).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = `✓ Copied!`;
        showToast(`Copied: ${fullPath}`);
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = `📋 Copy Path`;
        }, 1500);
      });
    }

    function addActiveTag(tag) {
      const normalized = tag.toLowerCase().trim();
      if (!normalized) return;
      if (!activeTags.includes(normalized)) {
        activeTags.push(normalized);
        renderActiveTagChips();
        searchInput.value = '';
        closeAutocomplete();
        render();
      }
    }

    function removeActiveTag(tag) {
      activeTags = activeTags.filter(t => t !== tag);
      renderActiveTagChips();
      render();
    }

    function renderActiveTagChips() {
      activeTagChips.innerHTML = activeTags.map(tag => `
        <span class="tag-chip-active">
          🏷️ ${tag}
          <span class="remove-btn" onclick="removeActiveTag('${tag}')">&times;</span>
        </span>
      `).join('');
    }

    searchInput.addEventListener('input', (e) => {
      const val = e.target.value.toLowerCase().trim();
      if (!val) {
        closeAutocomplete();
        render();
        return;
      }
      
      const normVal = val.replace(/_/g, ' ');
      const matches = allUniqueTagsSorted.filter(t => {
        const normT = t.replace(/_/g, ' ');
        return !activeTags.includes(t) && (normT.includes(normVal) || t.includes(val));
      }).slice(0, 15);

      if (matches.length > 0) {
        autocompleteDropdown.innerHTML = matches.map(t => `
          <div class="autocomplete-item" onclick="addActiveTag('${t}')">
            <span>🏷️ ${t}</span>
            <span class="tag-count">${tagCountsMap[t]} models</span>
          </div>
        `).join('');
        autocompleteDropdown.classList.add('open');
      } else {
        closeAutocomplete();
      }
      render();
    });

    function closeAutocomplete() {
      autocompleteDropdown.classList.remove('open');
    }

    document.addEventListener('click', (e) => {
      if (!comboSearchContainer.contains(e.target)) {
        closeAutocomplete();
      }
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = searchInput.value.trim();
        if (val) {
          addActiveTag(val);
        }
      } else if (e.key === 'Backspace' && !searchInput.value && activeTags.length > 0) {
        removeActiveTag(activeTags[activeTags.length - 1]);
      }
    });

    function openModal(id) {
      const item = catalogData.find(m => m.id === id);
      if (!item) return;

      const modelType = item.model_type || item.format || 'live2d';
      const thumbUrl = getThumbUrl(item);

      modalTitle.textContent = item.title || 'Model Details';

      modalPreview.innerHTML = thumbUrl 
        ? `<img src="${thumbUrl}" alt="${item.title}">` 
        : `<div class="thumb-placeholder">${modelType.toUpperCase()}</div>`;

      const p = item.provenance || {};
      const container = item.container || {};
      const fileSizeMB = container.file_size ? (container.file_size / (1024 * 1024)).toFixed(2) + ' MB' : 'N/A';
      const tags = item.tags || [];

      modalDetails.innerHTML = `
        <div class="detail-group">
          <div class="detail-label">Format & Container</div>
          <div class="detail-value">
            <strong>${item.model_type.toUpperCase()}</strong> • ${container.file_name || 'N/A'} (${fileSizeMB})
          </div>
        </div>

        <div class="detail-group">
          <div class="detail-label">Provenance & Origin</div>
          <div class="detail-value">
            ${p.character_name ? `<div><strong>Character:</strong> ${p.character_name}</div>` : ''}
            ${p.source_type ? `<div><strong>Source:</strong> ${p.source_type}</div>` : ''}
            ${p.original_filename ? `<div><strong>Original Folder:</strong> ${p.original_filename}</div>` : ''}
          </div>
        </div>

        <div class="detail-group">
          <div class="detail-label">Tags (${tags.length})</div>
          <div class="tag-container">
            ${tags.map(t => `<span class="tag-chip" onclick="addActiveTag('${t}'); closeModal();">${t}</span>`).join('')}
          </div>
        </div>

        <button class="btn-copy" style="margin-top: 0.5rem;" onclick="copyPath('${item.relative_container_path}', this, event)">
          📋 Copy Full File Path
        </button>
      `;

      metaModal.classList.add('open');
    }

    function closeModal() {
      metaModal.classList.remove('open');
    }

    metaModal.addEventListener('click', (e) => {
      if (e.target === metaModal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    function itemMatchesTerm(m, term) {
      const normTerm = term.toLowerCase().replace(/_/g, ' ');
      const title = (m.title || '').toLowerCase().replace(/_/g, ' ');
      const author = (m.creator || m.provenance?.author || '').toLowerCase();
      const tagsStr = (m.tags || []).join(' ').toLowerCase().replace(/_/g, ' ');
      const idStr = (m.id || '').toLowerCase().replace(/_/g, ' ');

      return title.includes(normTerm) || tagsStr.includes(normTerm) || author.includes(normTerm) || idStr.includes(normTerm);
    }

    function render() {
      const textQuery = searchInput.value.toLowerCase().trim();
      const allTerms = [...activeTags];
      if (textQuery) {
        allTerms.push(textQuery);
      }

      const filtered = catalogData.filter(m => {
        const modelType = (m.model_type || m.format || 'live2d').toLowerCase();
        const matchesType = (currentFilter === 'all') || (modelType === currentFilter);

        if (!matchesType) return false;
        if (allTerms.length === 0) return true;

        if (matchMode === 'and') {
          return allTerms.every(term => itemMatchesTerm(m, term));
        } else {
          return allTerms.some(term => itemMatchesTerm(m, term));
        }
      });

      totalCountEl.textContent = `${filtered.length} Models`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-muted);">No matching models found. Try adjusting active tags or switching to MATCH ANY (OR) mode.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(m => {
        const modelType = m.model_type || m.format || 'live2d';
        const thumbUrl = getThumbUrl(m);
        const containerPath = m.relative_container_path || m.file || '';
        const fileSizeMB = m.container?.file_size ? (m.container.file_size / (1024 * 1024)).toFixed(1) + ' MB' : '';
        const originSub = m.creator || m.provenance?.character_name || m.provenance?.source_type || 'Archive';

        return `
          <div class="card" onclick="openModal('${m.id}')">
            <div class="thumb-wrapper">
              ${thumbUrl 
                ? `<img src="${thumbUrl}" alt="${m.title}" loading="lazy" onerror="handleThumbError(this, '${m.id}', '${m.thumbnail || ''}', '${modelType}')">` 
                : `<div class="thumb-placeholder">${modelType.toUpperCase()}</div>`}
              <span class="type-badge type-${modelType.toLowerCase()}">${modelType}</span>
            </div>
            <div class="card-body">
              <div class="card-title" title="${m.title}">${m.title}</div>
              <div class="card-meta">
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px;">${originSub}</span>
                <span>${fileSizeMB}</span>
              </div>
              <button class="btn-copy" onclick="copyPath('${containerPath}', this, event)">
                📋 Copy Path
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    filterPills.addEventListener('click', (e) => {
      if (e.target.classList.contains('pill')) {
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        render();
      }
    });

    loadCatalog();
  </script>
</body>
</html>
