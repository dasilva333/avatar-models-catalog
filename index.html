<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Models - Definitive Catalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0c10;
      --bg-card: rgba(20, 24, 33, 0.7);
      --bg-card-hover: rgba(30, 36, 50, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-live2d: #38bdf8;
      --accent-vrm: #a855f7;
      --accent-mmd: #f43f5e;
      --accent-vrma: #10b981;
      --accent-spine: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(15, 18, 26, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 1.25rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge-count {
      background: rgba(168, 85, 247, 0.15);
      color: var(--accent-vrm);
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      max-width: 1200px;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: var(--accent-vrm);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.2);
    }

    .filter-pills {
      display: flex;
      gap: 0.4rem;
    }
    .pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.825rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .pill.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .smb-config {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
    }
    .smb-config label { color: var(--text-muted); }
    .smb-config input {
      background: transparent;
      border: none;
      color: var(--accent-live2d);
      font-family: monospace;
      font-size: 0.825rem;
      outline: none;
      width: 180px;
    }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.6);
      background: var(--bg-card-hover);
    }

    .thumb-wrapper {
      width: 100%;
      height: 240px;
      background: #0f1219;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .card:hover .thumb-wrapper img {
      transform: scale(1.04);
    }
    .thumb-placeholder {
      color: rgba(255, 255, 255, 0.15);
      font-size: 2.5rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .type-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      font-size: 0.675rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
    .type-live2d { background: var(--accent-live2d); color: #000; }
    .type-vrm { background: var(--accent-vrm); color: #fff; }
    .type-mmd { background: var(--accent-mmd); color: #fff; }
    .type-vrma { background: var(--accent-vrma); color: #000; }
    .type-spine { background: var(--accent-spine); color: #000; }

    .card-body {
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }
    .card-title {
      font-size: 0.925rem;
      font-weight: 600;
      line-height: 1.3;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      height: 2.4em;
    }

    .card-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-copy {
      margin-top: auto;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }
    .btn-copy:hover {
      background: var(--accent-live2d);
      color: #000;
      border-color: var(--accent-live2d);
      font-weight: 600;
    }
    .btn-copy.copied {
      background: var(--accent-vrma);
      color: #000;
      border-color: var(--accent-vrma);
    }

    /* Modal Overlay & Card Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 7, 10, 0.85);
      backdrop-filter: blur(12px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #121620;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      width: 100%;
      max-width: 850px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .modal-header {
      padding: 1.5rem 1.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }
    .modal-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }
    .modal-close {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .modal-close:hover { background: rgba(244, 63, 94, 0.6); }

    .modal-body {
      padding: 1.75rem;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1.75rem;
    }
    @media (max-width: 700px) {
      .modal-body { grid-template-columns: 1fr; }
    }

    .modal-preview {
      width: 100%;
      height: 340px;
      background: #090b10;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-details {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .detail-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .detail-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent-live2d);
    }
    .detail-value {
      font-size: 0.925rem;
      color: #e5e7eb;
      word-break: break-all;
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      max-height: 140px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .tag-chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #10b981;
      color: #000;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.875rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2000;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>AVATAR MODELS CATALOG</h1>
      <span class="badge-count" id="totalCount">0 Models</span>
    </div>

    <div class="controls-row">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search title, author, game, franchise, or booru tag...">
      </div>

      <div class="filter-pills" id="filterPills">
        <button class="pill active" data-filter="all">All</button>
        <button class="pill" data-filter="live2d">Live2D</button>
        <button class="pill" data-filter="vrm">VRM</button>
        <button class="pill" data-filter="spine">Spine</button>
        <button class="pill" data-filter="mmd">MMD</button>
        <button class="pill" data-filter="vrma">VRMA</button>
      </div>

      <div class="smb-config">
        <label for="folderFilter">Source Folder:</label>
        <select id="folderFilter" style="background: transparent; border: none; color: var(--accent-vrm); font-weight: 600; font-size: 0.825rem; outline: none; cursor: pointer;">
          <option value="all" style="background: #0f1219; color: #fff;">All Folders</option>
          <option value="CRAFTED" style="background: #0f1219; color: #fff;">CRAFTED</option>
          <option value="NORMALS" style="background: #0f1219; color: #fff;">NORMALS</option>
          <option value="funny_66" style="background: #0f1219; color: #fff;">funny_66</option>
          <option value="funny_version" style="background: #0f1219; color: #fff;">funny_version</option>
          <option value="batch_shinobu" style="background: #0f1219; color: #fff;">batch_shinobu</option>
          <option value="packages_vrm" style="background: #0f1219; color: #fff;">packages_vrm</option>
          <option value="reverse_1999" style="background: #0f1219; color: #fff;">Reverse 1999</option>
          <option value="trickcal" style="background: #0f1219; color: #fff;">Trickcal</option>
        </select>
      </div>

      <div class="smb-config">
        <label for="smbPath">Copy Base Path:</label>
        <input type="text" id="smbPath" value="E:\Avatar Models">
      </div>
    </div>
  </header>

  <main>
    <div class="grid" id="catalogGrid"></div>
  </main>

  <!-- Rich Metadata Modal -->
  <div class="modal-overlay" id="metaModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Model Details</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-preview" id="modalPreview"></div>
        <div class="modal-details" id="modalDetails"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied path to clipboard!</div>

  <script>
    let catalogData = [];
    let currentFilter = 'all';
    let currentFolder = 'all';

    const grid = document.getElementById('catalogGrid');
    const searchInput = document.getElementById('searchInput');
    const filterPills = document.getElementById('filterPills');
    const folderFilter = document.getElementById('folderFilter');
    const smbPathInput = document.getElementById('smbPath');
    const totalCountEl = document.getElementById('totalCount');
    const toast = document.getElementById('toast');
    const metaModal = document.getElementById('metaModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalPreview = document.getElementById('modalPreview');
    const modalDetails = document.getElementById('modalDetails');

    folderFilter.addEventListener('change', (e) => {
      currentFolder = e.target.value;
      render();
    });

    const savedSmb = localStorage.getItem('avatar_smb_path');
    if (savedSmb) smbPathInput.value = savedSmb;

    smbPathInput.addEventListener('input', (e) => {
      localStorage.setItem('avatar_smb_path', e.target.value);
    });

    async function loadCatalog() {
      try {
        const res = await fetch(`catalog.json?v=${Date.now()}`);
        const data = await res.json();
        catalogData = data.models || [];
        render();
      } catch (err) {
        console.error('Error loading catalog.json:', err);
        grid.innerHTML = `<div style="color: #f43f5e; padding: 2rem;">Error loading catalog.json</div>`;
      }
    }

    function getThumbUrl(item) {
      if (!item) return null;
      let raw = (item.thumbnail || item.relative_thumbnail_path || '').replace(/^\/+/, '');
      if (!raw) return null;
      if (raw.startsWith('http://') || raw.startsWith('https://')) return raw;
      return `https://raw.githubusercontent.com/dasilva333/avatar-models-catalog/main/${raw}`;
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function copyPath(relPath, btn, event) {
      if (event) event.stopPropagation();
      const basePath = smbPathInput.value.replace(/[/\\]+$/, '');
      const fullPath = `${basePath}\\${relPath.replace(/\//g, '\\')}`;
      
      navigator.clipboard.writeText(fullPath).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = `✓ Copied!`;
        showToast(`Copied: ${fullPath}`);
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = `📋 Copy Path`;
        }, 1500);
      });
    }

    function openModal(id) {
      const item = catalogData.find(m => m.id === id);
      if (!item) return;

      const modelType = item.model_type || item.format || 'live2d';
      const thumbUrl = getThumbUrl(item);

      modalTitle.textContent = item.title || 'Model Details';

      modalPreview.innerHTML = thumbUrl 
        ? `<img src="${thumbUrl}" alt="${item.title}">` 
        : `<div class="thumb-placeholder">${modelType.toUpperCase()}</div>`;

      const p = item.provenance || {};
      const info = item.model_info || {};
      const container = item.container || {};
      const fileSizeMB = container.file_size ? (container.file_size / (1024 * 1024)).toFixed(2) + ' MB' : 'N/A';

      const visualTags = info.visual_tags || [];
      const tags = item.tags || [];

      modalDetails.innerHTML = `
        <div class="detail-group">
          <div class="detail-label">Format & Container</div>
          <div class="detail-value">
            <strong>${item.model_type.toUpperCase()}</strong> • ${container.file_name || 'N/A'} (${fileSizeMB})
          </div>
        </div>

        <div class="detail-group">
          <div class="detail-label">Provenance & Origin</div>
          <div class="detail-value">
            ${p.franchise ? `<div><strong>Franchise:</strong> ${p.franchise}</div>` : ''}
            ${p.character_name ? `<div><strong>Character:</strong> ${p.character_name}</div>` : ''}
            ${p.game ? `<div><strong>Game:</strong> ${p.game}</div>` : ''}
            ${p.author ? `<div><strong>Author:</strong> ${p.author}</div>` : ''}
            ${p.source_type ? `<div><strong>Source Type:</strong> ${p.source_type}</div>` : ''}
            ${p.original_repo_url ? `<div><strong>Repo:</strong> <a href="${p.original_repo_url}" target="_blank" style="color: var(--accent-live2d);">${p.original_repo_url}</a></div>` : ''}
            ${p.nizima_url ? `<div><strong>Nizima Market:</strong> <a href="${p.nizima_url}" target="_blank" style="color: var(--accent-vrm);">${p.nizima_url}</a></div>` : ''}
            ${p.tier ? `<div><strong>Tier:</strong> ${p.tier}</div>` : ''}
            ${p.original_subpath ? `<div><strong>Subpath:</strong> ${p.original_subpath}</div>` : ''}
          </div>
        </div>

        ${container.md5 ? `
          <div class="detail-group">
            <div class="detail-label">Checksum Hashes</div>
            <div class="detail-value" style="font-family: monospace; font-size: 0.8rem; color: var(--text-muted);">
              MD5: ${container.md5}<br>
              SHA256: ${container.sha256 || 'N/A'}
            </div>
          </div>
        ` : ''}

        ${visualTags.length > 0 ? `
          <div class="detail-group">
            <div class="detail-label">Visual & Booru Tags (${visualTags.length})</div>
            <div class="tag-container">
              ${visualTags.map(t => `<span class="tag-chip">${t}</span>`).join('')}
            </div>
          </div>
        ` : ''}

        <div class="detail-group">
          <div class="detail-label">System Tags</div>
          <div class="tag-container">
            ${tags.map(t => `<span class="tag-chip">${t}</span>`).join('')}
          </div>
        </div>

        <button class="btn-copy" style="margin-top: 0.5rem;" onclick="copyPath('${item.relative_container_path}', this, event)">
          📋 Copy Full File Path
        </button>
      `;

      metaModal.classList.add('open');
    }

    function closeModal() {
      metaModal.classList.remove('open');
    }

    metaModal.addEventListener('click', (e) => {
      if (e.target === metaModal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    function render() {
      const query = searchInput.value.toLowerCase().trim();

      const filtered = catalogData.filter(m => {
        const modelType = (m.model_type || m.format || 'live2d').toLowerCase();
        const matchesType = (currentFilter === 'all') || (modelType === currentFilter);
        const tagsStr = (m.tags || []).join(' ');
        const matchesFolder = (currentFolder === 'all') || tagsStr.includes(currentFolder) || (m.provenance?.source_collection || '').includes(currentFolder);

        if (!matchesType || !matchesFolder) return false;
        if (!query) return true;

        const title = (m.title || '').toLowerCase();
        const author = (m.creator || m.provenance?.author || '').toLowerCase();
        const game = (m.provenance?.game || '').toLowerCase();
        const franchise = (m.provenance?.franchise || '').toLowerCase();
        const charName = (m.provenance?.character_name || '').toLowerCase();
        const tags = tagsStr.toLowerCase();
        const visualTags = (m.model_info?.visual_tags || []).join(' ').toLowerCase();

        return title.includes(query) || author.includes(query) || game.includes(query) || franchise.includes(query) || charName.includes(query) || tags.includes(query) || visualTags.includes(query);
      });

      totalCountEl.textContent = `${filtered.length} Models`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-muted);">No matching models found.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(m => {
        const modelType = m.model_type || m.format || 'live2d';
        const thumbUrl = getThumbUrl(m);
        const containerPath = m.relative_container_path || m.file || '';
        const fileSizeMB = m.container?.file_size ? (m.container.file_size / (1024 * 1024)).toFixed(1) + ' MB' : '';
        const originSub = m.creator || m.provenance?.franchise || m.provenance?.author || m.provenance?.game || m.provenance?.source_type || 'Archive';

        return `
          <div class="card" onclick="openModal('${m.id}')">
            <div class="thumb-wrapper">
              ${thumbUrl 
                ? `<img src="${thumbUrl}" alt="${m.title}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'thumb-placeholder\\'>${modelType.toUpperCase()}</div>'">` 
                : `<div class="thumb-placeholder">${modelType.toUpperCase()}</div>`}
              <span class="type-badge type-${modelType.toLowerCase()}">${modelType}</span>
            </div>
            <div class="card-body">
              <div class="card-title" title="${m.title}">${m.title}</div>
              <div class="card-meta">
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px;">${originSub}</span>
                <span>${fileSizeMB}</span>
              </div>
              <button class="btn-copy" onclick="copyPath('${containerPath}', this, event)">
                📋 Copy Path
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    searchInput.addEventListener('input', render);

    filterPills.addEventListener('click', (e) => {
      if (e.target.classList.contains('pill')) {
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        render();
      }
    });

    loadCatalog();
  </script>
</body>
</html>
